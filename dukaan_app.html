/* DukaanOS Custom & Print Stylesheets */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');

:root {
  --primary: #059669;
  --primary-dark: #047857;
  --primary-light: #ecfdf5;
  --accent: #d97706;
  --danger: #dc2626;
  --danger-light: #fef2f2;
}

body {
  font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #f1f5f9;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/* Glassmorphism & Accents */
.glass-nav {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.dark-glass {
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(12px);
}

/* Low Stock Pulse Animation */
@keyframes warningPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
  }
  50% {
    transform: scale(1.02);
    box-shadow: 0 0 0 8px rgba(220, 38, 38, 0);
  }
}

.low-stock-pulse {
  animation: warningPulse 2s infinite ease-in-out;
}

/* Catalog Card Hover Effect */
.catalog-card {
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.catalog-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.12);
}

/* Printable Bill & Receipt Stylesheet */
@media print {
  body * {
    visibility: hidden;
  }
  #printableArea, #printableArea * {
    visibility: visible;
  }
  #printableArea {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 15px;
    background: white;
    color: black;
    font-size: 13px;
  }
  .no-print {
    display: none !important;
  }
  .print-page-break {
    page-break-after: always;
  }
}

/* Modal animation */
.modal-enter {
  animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalFadeIn {
  from {
    opacity: 0;
    transform: scale(0.96) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Toast Notification */
.toast-slide-up {
  animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes toastSlideUp {
  from {
    opacity: 0;
    transform: translate(-50%, 20px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

// Sound Synthesizer using Web Audio API (Offline, Zero-Asset)
const SoundFX = {
  ctx: null,
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playTone(freq, type, duration, gainVal = 0.08) {
    try {
      this.init();
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {
      // Audio might be blocked until user interaction
    }
  },
  click() {
    this.playTone(800, 'sine', 0.05, 0.04);
  },
  success() {
    this.playTone(523.25, 'triangle', 0.08, 0.06); // C5
    setTimeout(() => this.playTone(659.25, 'triangle', 0.12, 0.06), 70); // E5
    setTimeout(() => this.playTone(783.99, 'triangle', 0.18, 0.06), 140); // G5
  },
  alert() {
    this.playTone(400, 'sawtooth', 0.12, 0.08);
    setTimeout(() => this.playTone(300, 'sawtooth', 0.16, 0.08), 120);
  }
};

// Main DukaanOS Application State
class DukaanOS {
  constructor() {
    this.activeTab = 'dashboard'; // 'dashboard' | 'inventory' | 'showcase' | 'udhaar' | 'roznamcha' | 'settings'
    this.customerMode = false; // When true, locked into View-Only Customer Showcase
    this.settings = this.loadStorage('dukaan_settings', INITIAL_DUKAAN_SETTINGS);
    this.inventory = this.loadStorage('dukaan_inventory', INITIAL_INVENTORY);
    this.customers = this.loadStorage('dukaan_customers', INITIAL_CUSTOMERS);
    this.roznamcha = this.loadStorage('dukaan_roznamcha', INITIAL_ROZNAMCHA);

    // Active filters
    this.inventoryFilter = {
      category: 'all',
      search: '',
      stockStatus: 'all', // 'all' | 'low' | 'out' | 'in'
      sortBy: 'name'
    };

    this.showcaseFilter = {
      category: 'all',
      search: '',
      sortBy: 'featured'
    };

    this.udhaarFilter = {
      search: '',
      status: 'all' // 'all' | 'pending' | 'clear'
    };

    // Selected objects for modals
    this.currentCustomer = null;
    this.currentItem = null;
    this.toastTimer = null;
    this.receiptData = null;

    // Check URL parameters (e.g. ?mode=showcase for direct customer catalog links)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'showcase' || urlParams.get('catalog') === 'true') {
      this.customerMode = true;
      this.activeTab = 'showcase';
    }
  }

  // Storage Helpers
  loadStorage(key, fallback) {
    try {
      const saved = localStorage.getItem(key);
      if (saved) return JSON.parse(saved);
    } catch (e) {
      console.warn("Storage read error for key", key, e);
    }
    return JSON.parse(JSON.stringify(fallback));
  }

  saveStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.error("Storage write error for key", key, e);
    }
  }

  saveAll() {
    this.saveStorage('dukaan_settings', this.settings);
    this.saveStorage('dukaan_inventory', this.inventory);
    this.saveStorage('dukaan_customers', this.customers);
    this.saveStorage('dukaan_roznamcha', this.roznamcha);
  }

  // Toast Notification
  showToast(message, type = 'success') {
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');
    if (!toast || !toastMsg) return;

    toastMsg.textContent = message;
    
    // Icon & color styling
    toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 font-medium text-sm toast-slide-up text-white ";
    if (type === 'success') {
      toast.classList.add('bg-emerald-700', 'border', 'border-emerald-500');
      toastIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
      SoundFX.success();
    } else if (type === 'error') {
      toast.classList.add('bg-rose-700', 'border', 'border-rose-500');
      toastIcon.innerHTML = `<svg class="w-5 h-5 text-rose-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
      SoundFX.alert();
    } else {
      toast.classList.add('bg-slate-800', 'border', 'border-slate-700');
      toastIcon.innerHTML = `<svg class="w-5 h-5 text-sky-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
      SoundFX.click();
    }

    toast.classList.remove('hidden');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
    }, 3200);
  }

  // Navigation
  switchTab(tabId) {
    if (this.customerMode && tabId !== 'showcase') {
      this.customerMode = false;
    }
    this.activeTab = tabId;
    SoundFX.click();
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  enableCustomerMode() {
    this.customerMode = true;
    this.activeTab = 'showcase';
    SoundFX.click();
    this.render();
    this.showToast("Catalog View Active: Clean showcase view for customers (No buy button/cart)", "info");
  }

  exitCustomerMode() {
    this.customerMode = false;
    this.activeTab = 'dashboard';
    SoundFX.click();
    this.render();
    this.showToast("Returned to Shopkeeper Admin mode", "info");
  }

  // Calculations & Analytics
  getAnalytics() {
    const totalItems = this.inventory.length;
    const totalStockQty = this.inventory.reduce((sum, it) => sum + Number(it.stock || 0), 0);
    const stockValuation = this.inventory.reduce((sum, it) => sum + (Number(it.stock || 0) * Number(it.costPrice || 0)), 0);
    const retailStockValue = this.inventory.reduce((sum, it) => sum + (Number(it.stock || 0) * Number(it.sellPrice || 0)), 0);

    const lowStockItems = this.inventory.filter(it => Number(it.stock) <= Number(it.lowStockLimit || this.settings.defaultLowStockThreshold));
    const outOfStockItems = this.inventory.filter(it => Number(it.stock) === 0);

    // Customer balances
    let totalUdhaarPending = 0;
    let pendingCustomersCount = 0;
    
    this.customers.forEach(c => {
      const bal = this.getCustomerBalance(c);
      if (bal > 0) {
        totalUdhaarPending += bal;
        pendingCustomersCount++;
      }
    });

    // Today's summary from roznamcha & transactions
    const todayStr = new Date().toISOString().slice(0, 10);
    let todayCashSales = 0;
    let todayUdhaarGiven = 0;
    let todayUdhaarRecovered = 0;

    // From roznamcha
    this.roznamcha.forEach(r => {
      if (r.date && r.date.startsWith(todayStr)) {
        if (r.type === 'cash_sale') todayCashSales += Number(r.amount);
        if (r.type === 'udhaar_jama') todayUdhaarRecovered += Number(r.amount);
      }
    });

    // From customer transactions
    this.customers.forEach(c => {
      (c.transactions || []).forEach(tx => {
        if (tx.date && tx.date.startsWith(todayStr)) {
          if (tx.type === 'udhaar') todayUdhaarGiven += Number(tx.amount);
          if (tx.type === 'jama') todayUdhaarRecovered += Number(tx.amount);
        }
      });
    });

    return {
      totalItems,
      totalStockQty,
      stockValuation,
      retailStockValue,
      lowStockCount: lowStockItems.length,
      lowStockItems,
      outOfStockCount: outOfStockItems.length,
      totalCustomers: this.customers.length,
      pendingCustomersCount,
      totalUdhaarPending,
      todayCashSales,
      todayUdhaarGiven,
      todayUdhaarRecovered
    };
  }

  // Customer Ledger Helpers
  getCustomerBalance(customer) {
    if (!customer || !customer.transactions) return 0;
    return customer.transactions.reduce((bal, tx) => {
      if (tx.type === 'udhaar') return bal + Number(tx.amount || 0);
      if (tx.type === 'jama') return bal - Number(tx.amount || 0);
      return bal;
    }, 0);
  }

  getCustomerTotalCredit(customer) {
    if (!customer || !customer.transactions) return 0;
    return customer.transactions
      .filter(tx => tx.type === 'udhaar')
      .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
  }

  getCustomerTotalPaid(customer) {
    if (!customer || !customer.transactions) return 0;
    return customer.transactions
      .filter(tx => tx.type === 'jama')
      .reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
  }

  // Quick Stock Adjustment (+/- directly from table)
  adjustStock(itemId, delta, reason = 'Quick Adjust') {
    const item = this.inventory.find(i => i.id === itemId);
    if (!item) return;

    const newStock = Math.max(0, Number(item.stock) + delta);
    item.stock = newStock;
    this.saveAll();
    
    // Visual feedback
    if (delta > 0) {
      this.showToast(`Stock updated: ${item.name} (+${delta}) -> Now: ${newStock}`, 'success');
    } else {
      this.showToast(`Stock deducted: ${item.name} (${delta}) -> Now: ${newStock}`, 'info');
    }
    this.render();
  }

  // Customer Management
  addCustomer(name, phone, address, creditLimit = 5000, initialUdhaar = 0, notes = '') {
    const newCust = {
      id: 'cust-' + Date.now(),
      name: name.trim(),
      phone: phone.trim(),
      address: address.trim(),
      notes: notes.trim(),
      creditLimit: Number(creditLimit) || 5000,
      createdAt: new Date().toISOString(),
      transactions: []
    };

    if (Number(initialUdhaar) > 0) {
      newCust.transactions.push({
        id: 'tx-' + Date.now(),
        date: new Date().toISOString(),
        type: 'udhaar',
        amount: Number(initialUdhaar),
        description: 'Opening Udhaar Balance',
        mode: 'Initial Balance',
        balanceAfter: Number(initialUdhaar)
      });
    }

    this.customers.unshift(newCust);
    this.saveAll();
    this.showToast(`Grahak Joda Gaya: ${newCust.name}`, 'success');
    this.render();
    return newCust;
  }

  // Record Transaction (Udhaar Diya or Jama Kiya)
  recordTransaction(customerId, type, amount, description, mode = 'Cash') {
    const cust = this.customers.find(c => c.id === customerId);
    if (!cust) return;

    const currentBal = this.getCustomerBalance(cust);
    const amt = Number(amount);
    if (isNaN(amt) || amt <= 0) {
      this.showToast('Kripya sahi raqam (valid amount) bharein', 'error');
      return;
    }

    const newBal = (type === 'udhaar') ? (currentBal + amt) : (currentBal - amt);

    const tx = {
      id: 'tx-' + Date.now(),
      date: new Date().toISOString(),
      type: type, // 'udhaar' or 'jama'
      amount: amt,
      description: description.trim() || (type === 'udhaar' ? 'Samaan Udhaar Diya' : 'Payment Jama Received'),
      mode: mode,
      balanceAfter: newBal
    };

    if (!cust.transactions) cust.transactions = [];
    cust.transactions.push(tx);

    // If it's a jama (payment received), also add an entry to Roznamcha
    if (type === 'jama') {
      this.roznamcha.unshift({
        id: 'rz-' + Date.now(),
        date: new Date().toISOString(),
        type: 'udhaar_jama',
        amount: amt,
        description: `Udhaar Jama received from ${cust.name} (${mode})`,
        paymentMode: mode
      });
    }

    this.saveAll();
    
    if (type === 'udhaar') {
      this.showToast(`Udhaar darj hua: â‚¹${amt} (${cust.name})`, 'info');
    } else {
      this.showToast(`Jama darj hua: â‚¹${amt} (${cust.name}) - Balance: â‚¹${newBal}`, 'success');
    }

    this.render();
  }

      ...updatedData,

  // Backup & Restore
  exportBackup() {
    const data = {
      app: "DukaanOS",
      version: "2.0",
      exportDate: new Date().toISOString(),
      settings: this.settings,
      inventory: this.inventory,
      customers: this.customers,
      roznamcha: this.roznamcha
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `DukaanOS_Backup_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    this.showToast("Dukaan ka pura data download ho gaya (Backup Saved)!", "success");
  }

  importBackup(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.inventory && data.customers) {
          this.settings = data.settings || this.settings;
          this.inventory = data.inventory;
          this.customers = data.customers;
          this.roznamcha = data.roznamcha || [];
          this.saveAll();
          this.showToast("Backup safalta-purvak restore kar liya gaya!", "success");
          this.render();
        } else {
          this.showToast("Amaniy (Invalid) backup file format!", "error");
        }
      } catch (err) {
        this.showToast("File read karne me khata hui: " + err.message, "error");
      }
    };
    reader.readAsText(file);
  }

// ==========================================
// 2. INVENTORY & STOCK MANAGEMENT
// ==========================================
DukaanOS.prototype.renderInventory = function() {
  const categories = CATEGORIES;
  
  // Apply filtering
  let filtered = [...this.inventory];

  // Category filter
  if (this.inventoryFilter.category && this.inventoryFilter.category !== 'all') {
    filtered = filtered.filter(it => it.category === this.inventoryFilter.category);
  }

  // Stock status filter
  if (this.inventoryFilter.stockStatus === 'low') {
    filtered = filtered.filter(it => Number(it.stock) <= Number(it.lowStockLimit || this.settings.defaultLowStockThreshold));
  } else if (this.inventoryFilter.stockStatus === 'out') {
    filtered = filtered.filter(it => Number(it.stock) === 0);
  } else if (this.inventoryFilter.stockStatus === 'in') {
    filtered = filtered.filter(it => Number(it.stock) > Number(it.lowStockLimit || this.settings.defaultLowStockThreshold));
  }

  // Search filter
  if (this.inventoryFilter.search.trim()) {
    const q = this.inventoryFilter.search.toLowerCase();
    filtered = filtered.filter(it => 
      it.name.toLowerCase().includes(q) || 
      (it.categoryName && it.categoryName.toLowerCase().includes(q)) || 
      (it.sku && it.sku.toLowerCase().includes(q)) ||
      (it.description && it.description.toLowerCase().includes(q))
    );
  }

  // Sorting
  if (this.inventoryFilter.sortBy === 'stock_asc') {
    filtered.sort((a, b) => Number(a.stock) - Number(b.stock));
  } else if (this.inventoryFilter.sortBy === 'stock_desc') {
    filtered.sort((a, b) => Number(b.stock) - Number(a.stock));
  } else if (this.inventoryFilter.sortBy === 'price_asc') {
    filtered.sort((a, b) => Number(a.sellPrice) - Number(b.sellPrice));
  } else if (this.inventoryFilter.sortBy === 'price_desc') {
    filtered.sort((a, b) => Number(b.sellPrice) - Number(a.sellPrice));
  } else {
    filtered.sort((a, b) => a.name.localeCompare(b.name));
  }

  return `
    <div class="space-y-6">
      <!-- Title & Actions Bar -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>

// Modal Container Helpers
DukaanOS.prototype.showModal = function(htmlContent) {
  let modalContainer = document.getElementById('modalContainer');
  if (!modalContainer) {
    modalContainer = document.createElement('div');
    modalContainer.id = 'modalContainer';
    document.body.appendChild(modalContainer);
  }

  modalContainer.innerHTML = `
    <div class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden modal-enter">
        ${htmlContent}
      </div>
    </div>
  `;
};

DukaanOS.prototype.closeModal = function() {
  const modalContainer = document.getElementById('modalContainer');
  if (modalContainer) {
    modalContainer.innerHTML = '';
  }
};

DukaanOS.prototype.handleSaveNewItem = function(event) {
  event.preventDefault();
  const name = document.getElementById('mItemName').value;
  const category = document.getElementById('mItemCategory').value;
  const unit = document.getElementById('mItemUnit').value;
  const costPrice = document.getElementById('mItemCost').value;
  const sellPrice = document.getElementById('mItemSell').value;
  const stock = document.getElementById('mItemStock').value;
  const lowStockLimit = document.getElementById('mItemLowLimit').value;
  const description = document.getElementById('mItemDesc').value;

  this.addItem({
    name, category, unit, costPrice, sellPrice, stock, lowStockLimit, description
  });
  this.closeModal();
};

DukaanOS.prototype.handleSaveEditItem = function(event, itemId) {
  event.preventDefault();
  const name = document.getElementById('mEditName').value;
  const category = document.getElementById('mEditCategory').value;
  const unit = document.getElementById('mEditUnit').value;
  const costPrice = document.getElementById('mEditCost').value;
  const sellPrice = document.getElementById('mEditSell').value;
  const stock = document.getElementById('mEditStock').value;
  const lowStockLimit = document.getElementById('mEditLowLimit').value;
  const badge = document.getElementById('mEditBadge').value;
  const description = document.getElementById('mEditDesc').value;

  this.updateItem(itemId, {
    name, category, unit, costPrice, sellPrice, stock, lowStockLimit, badge, description
  });
  this.closeModal();
};

DukaanOS.prototype.handleSaveNewCustomer = function(event) {
  event.preventDefault();
  const name = document.getElementById('mCustName').value;
  const phone = document.getElementById('mCustPhone').value;
  const address = document.getElementById('mCustAddress').value;
  const opening = document.getElementById('mCustOpening').value;
  const notes = document.getElementById('mCustNotes').value;

  this.addCustomer(name, phone, address, 5000, opening, notes);
  this.closeModal();
};

DukaanOS.prototype.handleSaveTransaction = function(event) {
  event.preventDefault();
  const customerId = document.getElementById('mTxCustomerId').value;
  const type = document.querySelector('input[name="mTxType"]:checked').value;
  const amount = document.getElementById('mTxAmount').value;
  const mode = document.getElementById('mTxMode').value;
  const desc = document.getElementById('mTxDesc').value;

  this.recordTransaction(customerId, type, amount, desc, mode);
  this.closeModal();
};

DukaanOS.prototype.handleInlinePassbookTx = function(event, customerId) {
  event.preventDefault();
  const type = document.getElementById('mInType').value;
  const amount = document.getElementById('mInAmount').value;
  const desc = document.getElementById('mInDesc').value;

  this.recordTransaction(customerId, type, amount, desc, 'Counter');
  this.openPassbookModal(customerId); // refresh modal
};

DukaanOS.prototype.quickAddTransaction = function(customerId, type) {
  this.openRecordTxModal(customerId, type);
};

DukaanOS.prototype.handleSaveRoznamcha = function(event) {
  event.preventDefault();
  const type = document.getElementById('mRzType').value;
  const amount = document.getElementById('mRzAmount').value;
  const mode = document.getElementById('mRzMode').value;
  const desc = document.getElementById('mRzDesc').value;

  this.roznamcha.unshift({
    id: 'rz-' + Date.now(),
    date: new Date().toISOString(),
    type: type,
    amount: Number(amount),
    description: desc,
    paymentMode: mode
  });

  this.saveAll();
  this.showToast('Roznamcha me entry save ho gayi!', 'success');
  this.closeModal();
  this.render();
};

DukaanOS.prototype.saveSettingsForm = function(event) {
  event.preventDefault();
  this.settings.shopName = document.getElementById('settingShopName').value.trim();
  this.settings.ownerName = document.getElementById('settingOwnerName').value.trim();
  this.settings.tagline = document.getElementById('settingTagline').value.trim();
  this.settings.phone = document.getElementById('settingPhone').value.trim();
  this.settings.whatsapp = document.getElementById('settingWhatsApp').value.trim();
  this.settings.upiId = document.getElementById('settingUpiId').value.trim();
  this.settings.address = document.getElementById('settingAddress').value.trim();
  this.settings.defaultLowStockThreshold = Number(document.getElementById('settingLowStock').value) || 5;

  this.saveAll();
  this.showToast('Dukaan Settings safalta-purvak save ho gayi!', 'success');
  this.render();
};

DukaanOS.prototype.filterByCategory = function(catId) {
  this.inventoryFilter.category = catId;

};

  this.inventoryFilter.stockStatus = 'low';

  this.render();
};

  const input = document.getElementById('inventorySearchInput');

    input.focus();
    input.setSelectionRange(val.length, val.length);

};
